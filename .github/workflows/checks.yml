name: Local app checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python scripts/test_offline.py
      - run: python -m compileall -q api core fetchers scripts run.py
      - run: python scripts/evaluate_matcher.py examples/matcher_synthetic.json --bm25-only --k 5
  frontend:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ui-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - run: npm ci
      - run: npm run build
